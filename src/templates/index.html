<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unifi Client Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .device-card {
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Unifi Client Manager</h1>
        <button class="btn btn-primary mb-3" onclick="loadClients()">Refresh Clients</button>

        <div id="loading" class="d-none">Loading...</div>

        <div id="clients-list" class="row"></div>
    </div>

    <!-- Modal for History -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="historyModalLabel">Data Usage History</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
                <select id="timeRange" class="form-select" onchange="updateChart()">
                    <option value="6">Past 6 Hours</option>
                    <option value="12">Past 12 Hours</option>
                    <option value="72">Past 3 Days</option>
                    <option value="168">Past Week</option>
                    <option value="720">Past Month</option>
                </select>
            </div>
            <div class="chart-container">
                <canvas id="usageChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        let clients = [];
        let currentChart = null;
        let currentHistoryData = [];

        async function loadClients() {
            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('clients-list').innerHTML = '';
            try {
                const response = await fetch('/api/clients');
                clients = await response.json();
                renderClients();
            } catch (error) {
                alert('Error loading clients: ' + error);
            }
            document.getElementById('loading').classList.add('d-none');
        }

        function renderClients() {
            const container = document.getElementById('clients-list');
            container.innerHTML = '';

            clients.forEach(client => {
                const name = escapeHTML(client.name || client.hostname || 'Unknown Device');
                const mac = escapeHTML(client.mac);
                const ip = escapeHTML(client.ip || 'N/A');
                const isBlocked = client.blocked || false;

                const col = document.createElement('div');
                col.className = 'col-md-4';

                col.innerHTML = `
                    <div class="card device-card ${isBlocked ? 'bg-light text-muted' : ''}">
                        <div class="card-body">
                            <h5 class="card-title">${name}</h5>
                            <p class="card-text">
                                MAC: ${mac}<br>
                                IP: ${ip}
                            </p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-sm btn-info text-white" data-mac="${mac}" data-name="${name}" onclick="viewHistory(this)">View Usage</button>
                                ${isBlocked
                                    ? `<button class="btn btn-sm btn-success" onclick="toggleBlock('${mac}', false)">Unpause Data</button>`
                                    : `<button class="btn btn-sm btn-warning" onclick="toggleBlock('${mac}', true)">Pause Data</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        async function toggleBlock(mac, block) {
            const action = block ? 'block' : 'unblock';
            try {
                const response = await fetch(`/api/client/${mac}/${action}`, { method: 'POST' });
                if (response.ok) {
                    loadClients(); // Reload to reflect changes
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.error);
                }
            } catch (error) {
                alert('Error: ' + error);
            }
        }

        async function viewHistory(btn) {
            const mac = btn.getAttribute('data-mac');
            const name = btn.getAttribute('data-name');
            document.getElementById('historyModalLabel').innerText = `Data Usage: ${name}`;
            const modal = new bootstrap.Modal(document.getElementById('historyModal'));
            modal.show();

            try {
                const response = await fetch(`/api/client/${mac}/history`);
                currentHistoryData = await response.json();
                updateChart();
            } catch (error) {
                alert('Error loading history: ' + error);
            }
        }

        function updateChart() {
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }
            if (!currentHistoryData || currentHistoryData.length === 0) return;

            const hours = parseInt(document.getElementById('timeRange').value);
            const cutoffTime = Date.now() - (hours * 60 * 60 * 1000);

            const filteredData = currentHistoryData.filter(d => d.time > cutoffTime);

            const labels = filteredData.map(d => new Date(d.time).toLocaleString());
            const rxData = filteredData.map(d => (d.rx_bytes || 0) / (1024*1024)); // Convert to MB
            const txData = filteredData.map(d => (d.tx_bytes || 0) / (1024*1024));


            const ctx = document.getElementById('usageChart').getContext('2d');
            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Download (MB)',
                            data: rxData,
                            borderColor: 'rgb(75, 192, 192)',
                            tension: 0.1
                        },
                        {
                            label: 'Upload (MB)',
                            data: txData,
                            borderColor: 'rgb(255, 99, 132)',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Initial load
        loadClients();
    </script>
</body>
</html>
