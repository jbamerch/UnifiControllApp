version: '3.8'
services:
  unifi-manager:
    image: abc/unificontrollapp:test
    container_name: unifi-manager
    ports:
      - "5000:5000"
    environment:
      - UNIFI_HOST=192.168.1.1
      - UNIFI_USER=admin
      - UNIFI_PASS=password
      # - UNIFI_VERSION=UDMP-unifiOS
      # - UNIFI_SITE=default
      # - UNIFI_PORT=443
    restart: unless-stopped
